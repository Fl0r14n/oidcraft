name: publish

# One workflow for every published package, so each package's trusted publisher names this file.
# The release tag says which: <name>@<version>, e.g. @oidcraft/provider@0.1.0 or @oidcraft/vue@7.0.0.
# A package depending on @oidcraft/core, @oidcraft/client or @oidcraft/adapter needs the version it names published first.
on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: The release to publish, as <name>@<version>
        required: true

permissions:
  contents: read
  id-token: write # the OIDC token npm exchanges for publish rights

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          registry-url: https://registry.npmjs.org # points npm at the registry, independent of how it authenticates
      # Before the build, so a wrong tag fails in seconds rather than after all of it.
      - name: Which package, and does the tag match it
        id: target
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          case "$TAG" in
            @oidcraft/core@*) dir=packages/core ;;
            @oidcraft/client@*) dir=packages/client ;;
            @oidcraft/adapter@*) dir=packages/adapter ;;
            @oidcraft/provider@*) dir=packages/provider ;;
            @oidcraft/drizzle@*) dir=packages/drizzle ;;
            @oidcraft/kysely@*) dir=packages/kysely ;;
            @oidcraft/typeorm@*) dir=packages/typeorm ;;
            @oidcraft/redis@*) dir=packages/redis ;;
            @oidcraft/vue@*) dir=packages/vue ;;
            @oidcraft/react@*) dir=packages/react ;;
            @oidcraft/angular@*) dir=packages/angular ;;
            *) echo "::error::tag $TAG names no published package; expected <name>@<version>"; exit 1 ;;
          esac
          actual=$(node -p "const p = require('./$dir/package.json'); p.name + '@' + p.version")
          if [ "$TAG" != "$actual" ]; then
            echo "::error::tag $TAG does not match $dir/package.json, which is $actual"
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bun run build
      - run: bun run typecheck
      - run: bun test
      # trusted publishing needs npm >= 11.5.1; the npm bundled with node drifts, so take the latest
      - run: npm install -g npm@latest
      # bun packs, because npm would ship `workspace:^` verbatim; bun rewrites it to the version.
      - name: pack
        id: pack
        working-directory: ${{ steps.target.outputs.dir }}
        run: echo "tarball=$(bun pm pack --quiet --ignore-scripts --destination "$RUNNER_TEMP")" >> "$GITHUB_OUTPUT"
      # No NODE_AUTH_TOKEN: each package's trusted publisher names this repo and this file, and
      # exchanges the OIDC token above for publish rights, with provenance. Register a package once,
      # after its first publish by hand:
      #   npm trust github <name> --repo Fl0r14n/oidcraft --file publish.yml --allow-publish
      # npm, not bun: bun publish cannot do trusted publishing or provenance.
      - run: npm publish "${{ steps.pack.outputs.tarball }}" --access public
