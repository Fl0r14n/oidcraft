# The services the gated adapter suites run against, as CI's service containers do:
#
#   docker compose up -d
#   POSTGRES_URL=postgres://postgres:oidcraft@localhost:55432/oidcraft REDIS_URL=redis://localhost:56379 \
#   MYSQL_URL=mysql://root:oidcraft@localhost:53306/oidcraft MARIADB_URL=mysql://root:oidcraft@localhost:53307/oidcraft bun run test
#
# Unusual host ports, so they never collide with a Postgres or Redis already on this machine.
# Nothing persists: a test makes its own schema or key prefix and drops it.
services:
  postgres:
    # Postgres 19 is not released yet; rc1 is the newest image. Move to 19 when it ships.
    image: postgres:19rc1-alpine
    environment:
      POSTGRES_PASSWORD: oidcraft
      POSTGRES_DB: oidcraft
    ports:
      - ${POSTGRES_PORT:-55432}:5432
    healthcheck:
      test: [ CMD, pg_isready, -U, postgres ]
      interval: 2s
      retries: 15
  redis:
    image: redis:alpine
    ports:
      - ${REDIS_PORT:-56379}:6379
  # One dialect, held to both servers (FR-A4): what passes on one and not the other is outside the shared subset.
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: oidcraft
      MYSQL_DATABASE: oidcraft
    ports:
      - ${MYSQL_PORT:-53306}:3306
    healthcheck:
      test: [ CMD, mysqladmin, ping, -h, 127.0.0.1, -poidcraft ]
      interval: 2s
      retries: 30
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: oidcraft
      MARIADB_DATABASE: oidcraft
    ports:
      - ${MARIADB_PORT:-53307}:3306
    healthcheck:
      test: [ CMD, healthcheck.sh, --connect, --innodb_initialized ]
      interval: 2s
      retries: 30
